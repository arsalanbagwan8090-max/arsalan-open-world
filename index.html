
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARSALAN OPEN WORLD</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 font-family:Arial;background:#87ceeb;
 touch-action:none;
}
canvas{display:block}
#info{
 position:absolute;top:12px;left:12px;
 color:white;background:#0009;
 padding:12px;border-radius:10px;z-index:2;
 pointer-events:none;
}
#pad{
 position:absolute;bottom:35px;left:35px;
 width:120px;height:120px;border-radius:50%;
 background:#ffffff55;border:2px solid white;
 touch-action:none;z-index:3;
}
#stick{
 position:absolute;width:48px;height:48px;
 left:34px;top:34px;border-radius:50%;
 background:#fff;border:2px solid #555;
 pointer-events:none;
}
#hint{
 position:absolute;bottom:12px;right:12px;
 color:white;background:#0008;
 padding:10px;border-radius:8px;
 pointer-events:none;
}
</style>
</head>

<body>

<div id="info">
<b>ARSALAN OPEN WORLD</b><br>
3D CITY EXPLORER
</div>

<div id="pad"><div id="stick"></div></div>
<div id="hint">Joystick se chalo</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,180);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,0.1,500
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667755,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(30,60,20);
sun.castShadow=true;
scene.add(sun);

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({color:0x47834b})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// ROADS
function road(x,z,w,d){
 const r=new THREE.Mesh(
  new THREE.PlaneGeometry(w,d),
  new THREE.MeshStandardMaterial({color:0x333333})
 );
 r.rotation.x=-Math.PI/2;
 r.position.set(x,0.03,z);
 scene.add(r);
}

road(0,0,18,400);
road(0,0,400,18);
road(35,0,12,400);
road(-35,0,12,400);
road(0,35,400,12);
road(0,-35,400,12);

// BUILDINGS
for(let x=-90;x<=90;x+=30){
 for(let z=-90;z<=90;z+=30){
  if(Math.abs(x)<22||Math.abs(z)<22)continue;

  const h=8+Math.random()*30;

  const b=new THREE.Mesh(
   new THREE.BoxGeometry(12,h,12),
   new THREE.MeshStandardMaterial({
    color:new THREE.Color().setHSL(
     0.55+Math.random()*0.12,
     0.18,0.45+Math.random()*0.2
    )
   })
  );

  b.position.set(x,h/2,z);
  b.castShadow=true;
  b.receiveShadow=true;
  scene.add(b);
 }
}

// PLAYER
const player=new THREE.Group();
scene.add(player);

const blue=new THREE.MeshStandardMaterial({color:0x2455dd});
const skin=new THREE.MeshStandardMaterial({color:0xe3ad83});
const dark=new THREE.MeshStandardMaterial({color:0x172d55});

// BODY
const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(0.55,0.9,4,10),blue
);
body.position.y=1.35;
body.castShadow=true;
player.add(body);

// HEAD
const head=new THREE.Mesh(
 new THREE.SphereGeometry(0.38,20,20),skin
);
head.position.y=2.35;
head.castShadow=true;
player.add(head);

// HAIR
const hair=new THREE.Mesh(
 new THREE.SphereGeometry(0.39,16,12,0,Math.PI*2,0,Math.PI/2),
 dark
);
hair.position.y=2.48;
player.add(hair);

// ARMS
function makeLimb(radius,length,material){
 const pivot=new THREE.Group();
 const mesh=new THREE.Mesh(
  new THREE.CapsuleGeometry(radius,length,4,8),
  material
 );
 mesh.position.y=-length/2;
 mesh.castShadow=true;
 pivot.add(mesh);
 player.add(pivot);
 return pivot;
}

const leftArm=makeLimb(0.16,0.65,blue);
const rightArm=makeLimb(0.16,0.65,blue);

leftArm.position.set(-0.65,1.75,0);
rightArm.position.set(0.65,1.75,0);

// LEGS
const leftLeg=makeLimb(0.20,0.65,dark);
const rightLeg=makeLimb(0.20,0.65,dark);

leftLeg.position.set(-0.27,0.85,0);
rightLeg.position.set(0.27,0.85,0);

// JOYSTICK
const pad=document.getElementById("pad");
const stick=document.getElementById("stick");

let joyX=0,joyY=0,active=false;

function joystick(e){
 const r=pad.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);
 let y=e.clientY-(r.top+r.height/2);
 const max=38;
 const len=Math.hypot(x,y);

 if(len>max){
  x=x/len*max;
  y=y/len*max;
 }

 joyX=x/max;
 joyY=y/max;

 stick.style.left=(34+x)+"px";
 stick.style.top=(34+y)+"px";
}

pad.addEventListener("pointerdown",e=>{
 active=true;
 pad.setPointerCapture(e.pointerId);
 joystick(e);
});

pad.addEventListener("pointermove",e=>{
 if(active)joystick(e);
});

function stop(){
 active=false;
 joyX=0;
 joyY=0;
 stick.style.left="34px";
 stick.style.top="34px";
}

pad.addEventListener("pointerup",stop);
pad.addEventListener("pointercancel",stop);

// KEYBOARD
const keys={};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
});

// CAMERA
const clock=new THREE.Clock();
const cameraOffset=new THREE.Vector3(0,7,-12);
const up=new THREE.Vector3(0,1,0);
let walkTime=0;

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.05);

 let x=joyX;
 let z=joyY;

 if(keys["w"]||keys["arrowup"])z=-1;
 if(keys["s"]||keys["arrowdown"])z=1;
 if(keys["a"]||keys["arrowleft"])x=-1;
 if(keys["d"]||keys["arrowright"])x=1;

 const length=Math.hypot(x,z);
 const moving=length>0.1;

 if(moving){
  x/=length;
  z/=length;

  const angle=Math.atan2(x,z);
  player.rotation.y=angle;

  player.position.x+=x*8*dt;
  player.position.z+=z*8*dt;

  walkTime+=dt*10;

  leftArm.rotation.x=Math.sin(walkTime)*0.7;
  rightArm.rotation.x=-Math.sin(walkTime)*0.7;

  leftLeg.rotation.x=-Math.sin(walkTime)*0.7;
  rightLeg.rotation.x=Math.sin(walkTime)*0.7;

 }else{
  leftArm.rotation.x=0;
  rightArm.rotation.x=0;
  leftLeg.rotation.x=0;
  rightLeg.rotation.x=0;
 }

 // CAMERA FOLLOW
 const offset=cameraOffset.clone();
 offset.applyAxisAngle(up,player.rotation.y);

 const target=player.position.clone().add(offset);
 const smooth=1-Math.exp(-6*dt);

 camera.position.lerp(target,smooth);

 camera.lookAt(
  player.position.x,
  player.position.y+1.3,
  player.position.z
 );

 renderer.render(scene,camera);
}

animate();

// RESIZE
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>

head.position.y=2.15;
player.add(head);

player.position.set(0,0,0);

function joystick(e){
 const r=pad.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2);

 const max=38;
 const len=Math.hypot(x,y);

 joyX=x/max;
 joyY=y/max;

 if(moving){

  player.rotation.y=angle;
  player.position.x+=Math.sin(angle)*dt*12;
  player.position.z+=Math.cos(angle)*dt*12;

 new THREE.Vector3(0,1,0),player.rotation.y
 );

 );
